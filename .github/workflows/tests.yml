name: WaveManager tests
on:
  pull_request:
  push:
    branches: [main, wave-manager-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  luau:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: '0.748'
          path: .luau-toolchain
          persist-credentials: false
      - name: Build Luau CLI
        run: |
          cmake -S .luau-toolchain -B /tmp/luau-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/luau-build --target Luau.Repl.CLI -j 2
      - name: Run native Luau regression suite
        run: /tmp/luau-build/luau tests/run.lua
      - name: Explore bounded state space
        run: /tmp/luau-build/luau tests/exhaustive.lua
      - name: Fractional-time and simulated-day checks
        run: /tmp/luau-build/luau tests/numeric.lua
      - name: Detect deliberate behavioral regressions
        run: python3 tests/mutation.py --runner /tmp/luau-build/luau
  portable-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run portable regression suite
        run: lua5.4 tests/run.lua
      - name: Test the example boundary with mocks (not Studio)
        run: lua5.4 tests/mock_roblox.lua
      - name: Check identity release with forced Lua collection
        run: lua5.4 tests/resource.lua
